<section class="modulex-st3" {{st3label}}>
  <div class="modulex-st3__wrap">
    <div class="modulex-st3__intro">
      {{st3head}}
      {{st3link}}
    </div>
    <dl class="modulex-st3__grid">{{st3items}}</dl>
  </div>
</section>

<style>
  /* stats-3 — bölünmüş anahtar rakamlar (1 Kas 2026). Renkler yalnız var(--mx-site-*) token'ları. */
  .modulex-st3 { box-sizing: border-box; width: 100%; padding: clamp(48px, 7vw, 96px) clamp(16px, 4vw, 32px); background: var(--mx-site-bg, #ffffff); color: var(--mx-site-text, #1b1b1b); }
  .modulex-st3 *, .modulex-st3 *::before, .modulex-st3 *::after { box-sizing: border-box; }
  .modulex-st3__wrap { max-width: --max--; margin-inline: auto; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(28px, 5vw, 72px); align-items: start; }
  .modulex-st3__head { max-width: 760px; margin-block-end: clamp(24px, 4vw, 40px); }
  .modulex-st3__eyebrow { margin: 0 0 8px; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mx-site-primary, #2563eb); }
  .modulex-st3__h2 { margin: 0 0 10px; font-size: clamp(1.5rem, 1.1rem + 1.6vw, 2.25rem); line-height: 1.2; color: var(--mx-site-text, #1b1b1b); }
  .modulex-st3__desc { margin: 0; font-size: 1rem; line-height: 1.65; color: color-mix(in srgb, var(--mx-site-text, #1b1b1b) 74%, transparent); }
  .modulex-st3__link { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-weight: 700; color: var(--mx-site-text, #1b1b1b); text-decoration: underline; text-decoration-color: var(--mx-site-accent, var(--mx-site-primary, #2563eb)); text-decoration-thickness: 2px; text-underline-offset: 5px; }
  .modulex-st3__link:hover { text-decoration-thickness: 3px; }
  .modulex-st3__link:focus-visible { outline: 3px solid var(--mx-site-primary, #2563eb); outline-offset: 4px; border-radius: 4px; }
  .modulex-st3__grid { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-block-start: 1px solid color-mix(in srgb, var(--mx-site-text, #1b1b1b) 16%, transparent); }
  .modulex-st3__cell { display: flex; flex-direction: column; padding: clamp(20px, 3vw, 32px) clamp(12px, 2.5vw, 28px); border-block-end: 1px solid color-mix(in srgb, var(--mx-site-text, #1b1b1b) 16%, transparent); }
  .modulex-st3__cell:nth-child(odd) { border-inline-end: 1px solid color-mix(in srgb, var(--mx-site-text, #1b1b1b) 16%, transparent); padding-inline-start: 0; }
  .modulex-st3__num { order: -1; margin: 0 0 8px; font-size: clamp(2.25rem, 1.6rem + 2.6vw, 3.75rem); font-weight: 800; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: var(--mx-site-text, #1b1b1b); }
  .modulex-st3__unit { font-size: 0.5em; font-weight: 700; margin-inline-start: 4px; color: var(--mx-site-primary, #2563eb); }
  .modulex-st3__label { margin: 0; font-size: 1rem; font-weight: 700; color: var(--mx-site-text, #1b1b1b); }
  .modulex-st3__note { margin: 4px 0 0; font-size: 0.9rem; line-height: 1.5; color: color-mix(in srgb, var(--mx-site-text, #1b1b1b) 70%, transparent); }
  @media (max-width: 860px) {
    .modulex-st3__wrap { grid-template-columns: 1fr; }
  }
  @media (max-width: 420px) {
    .modulex-st3__grid { grid-template-columns: 1fr; }
    .modulex-st3__cell:nth-child(odd) { border-inline-end: 0; }
    .modulex-st3__cell { padding-inline: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-st3 * { transition: none !important; animation: none !important; }
  }
</style>
