<style>
  /* kayan-kucuk-resim — Seçim noktayla değil görselin kendisiyle (küçük resim); metin görselin altında ayrı bilgi şeridinde — ürün/proje vitrini gibi okunur. */
  .modulex-kayan-kucuk-resim { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-kayan-kucuk-resim *, .modulex-kayan-kucuk-resim *::before, .modulex-kayan-kucuk-resim *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-kayan-kucuk-resim :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-kayan-kucuk-resim :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-kayan-kucuk-resim :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-kayan-kucuk-resim :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-kayan-kucuk-resim img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-kayan-kucuk-resim) img { height: auto; }
  .modulex-kayan-kucuk-resim [hidden] { display: none !important; }
  .modulex-kayan-kucuk-resim :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-kayan-kucuk-resim :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }

  .modulex-kayan-kucuk-resim-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-kayan-kucuk-resim-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-kayan-kucuk-resim-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-kayan-kucuk-resim-dugme:hover { transform: translateY(-2px); }
  .modulex-kayan-kucuk-resim-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-kayan-kucuk-resim-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-kayan-kucuk-resim-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-kayan-kucuk-resim { position: relative; }
  /* tam genişlik: taban «.modulex-kayan-kucuk-resim { padding }» ve 768px «padding-inline: 16px» kuralları sonra gelir → çift sınıfla sıfırla */
  .modulex-kayan-kucuk-resim.modulex-kayan-kucuk-resim { padding: 0; }
  .modulex-kayan-kucuk-resim-karusel { position: relative; outline: none; }
  .modulex-kayan-kucuk-resim-karusel:focus-visible { outline: 3px solid --accent--; outline-offset: -3px; }
  .modulex-kayan-kucuk-resim-durum { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .modulex-kayan-kucuk-resim-sust { color: inherit; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.92; }
  .modulex-kayan-kucuk-resim-sbaslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.9rem, 4.4vw, 3.6rem); font-weight: 780; letter-spacing: -0.03em; line-height: 1.05; }
  .modulex-kayan-kucuk-resim-smetin { font-size: clamp(1rem, 1.4vw, 1.15rem); line-height: 1.65; }
  .modulex-kayan-kucuk-resim-scta { display: inline-flex; align-items: center; gap: 8px; justify-self: start; min-height: 48px; padding: 12px 22px; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, box-shadow 0.25s ease; }
  .modulex-kayan-kucuk-resim-scta:hover { transform: translateY(-2px); box-shadow: 0 14px 26px -16px --accent--; }
  .modulex-kayan-kucuk-resim-scta .material-symbols-outlined { font-size: 20px; }
  .modulex-kayan-kucuk-resim-gorsel { width: 100%; height: 100%; object-fit: cover; }
  .modulex-kayan-kucuk-resim-yer { background: linear-gradient(135deg, color-mix(in srgb, --accent-- 55%, --text--), color-mix(in srgb, --accent-- 20%, --text--)); }
  .modulex-kayan-kucuk-resim-ok, .modulex-kayan-kucuk-resim-oynat { display: inline-grid; place-items: center; width: 48px; height: 48px; padding: 0; border: 1px solid --cizgi--; border-radius: 50%; background: --bg--; color: --text--; transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease; }
  .modulex-kayan-kucuk-resim-ok:hover, .modulex-kayan-kucuk-resim-oynat:hover { background: --accent--; color: --accentText--; border-color: --accent--; }
  .modulex-kayan-kucuk-resim-ok:active { transform: scale(0.94); }
  .modulex-kayan-kucuk-resim-nokta { padding: 0; border: 0; background: transparent; color: inherit; font: inherit; }
  .modulex-kayan-kucuk-resim-karusel--tek :is(.modulex-kayan-kucuk-resim-ok, .modulex-kayan-kucuk-resim-oynat, .modulex-kayan-kucuk-resim-nokta, .modulex-kayan-kucuk-resim-denetim, .modulex-kayan-kucuk-resim-sekmeler, .modulex-kayan-kucuk-resim-kucukler) { display: none; }

  .modulex-kayan-kucuk-resim-kap { max-width: --max--; margin-inline: auto; padding: clamp(24px, 4vw, 48px) 20px; }
  .modulex-kayan-kucuk-resim-sahne { position: relative; display: grid; }
  .modulex-kayan-kucuk-resim-slayt { grid-area: 1 / 1; display: grid; gap: 0; opacity: 0; visibility: hidden; transition: opacity 0.5s ease, visibility 0s linear 0.5s; }
  .modulex-kayan-kucuk-resim-slayt--aktif { opacity: 1; visibility: visible; transition: opacity 0.5s ease, visibility 0s; }
  .modulex-kayan-kucuk-resim-cerceve { overflow: hidden; height: clamp(260px, calc(var(--kayan-yk) - 200px), 640px); border-radius: --yuvarlak-- --yuvarlak-- 0 0; background: --kartBg--; }
  .modulex-kayan-kucuk-resim-cerceve .modulex-kayan-kucuk-resim-gorsel { transition: transform 0.8s ease; }
  .modulex-kayan-kucuk-resim-slayt--aktif .modulex-kayan-kucuk-resim-cerceve .modulex-kayan-kucuk-resim-gorsel { animation: modulex-kayan-kucuk-resim-yak 1s ease both; }
  @keyframes modulex-kayan-kucuk-resim-yak { from { transform: scale(1.05); } to { transform: none; } }
  .modulex-kayan-kucuk-resim-bilgi { padding: clamp(20px, 3vw, 32px); border: 1px solid --cizgi--; border-block-start: 0; border-radius: 0 0 --yuvarlak-- --yuvarlak--; background: --bg--; color: --text--; }
  .modulex-kayan-kucuk-resim-byazi { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px 32px; }
  .modulex-kayan-kucuk-resim-byazi > :not(.modulex-kayan-kucuk-resim-scta) { grid-column: 1; }
  .modulex-kayan-kucuk-resim-byazi .modulex-kayan-kucuk-resim-scta { grid-column: 2; grid-row: 1 / span 3; }
  .modulex-kayan-kucuk-resim-sust { color: --accentInk--; opacity: 1; }
  .modulex-kayan-kucuk-resim-sbaslik { font-size: clamp(1.6rem, 3vw, 2.4rem); }
  .modulex-kayan-kucuk-resim-smetin { color: --muted--; }
  .modulex-kayan-kucuk-resim-ok { position: absolute; inset-block-start: calc(clamp(260px, calc(var(--kayan-yk) - 200px), 640px) / 2 - 24px); z-index: 2; box-shadow: 0 10px 24px -14px color-mix(in srgb, --text-- 60%, transparent); }
  .modulex-kayan-kucuk-resim-ok--geri { inset-inline-start: 16px; }
  .modulex-kayan-kucuk-resim-ok--ileri { inset-inline-end: 16px; }
  .modulex-kayan-kucuk-resim-kucukler { display: flex; align-items: center; gap: 10px; margin-block-start: 16px; overflow-x: auto; padding: 4px; scrollbar-width: thin; }
  .modulex-kayan-kucuk-resim-nokta { flex: none; overflow: hidden; width: 112px; height: 72px; border: 2px solid transparent; border-radius: 12px; background: --kartBg--; opacity: 0.62; transition: opacity 0.25s ease, border-color 0.25s ease, transform 0.25s ease; }
  .modulex-kayan-kucuk-resim-nokta img { width: 100%; height: 100%; object-fit: cover; }
  .modulex-kayan-kucuk-resim-nokta:hover { opacity: 1; transform: translateY(-2px); }
  .modulex-kayan-kucuk-resim-nokta--aktif { border-color: --accent--; opacity: 1; }
  .modulex-kayan-kucuk-resim-kno { display: grid; place-items: center; height: 100%; color: --text--; font-weight: 800; }
  .modulex-kayan-kucuk-resim-oynat { flex: none; margin-inline-start: auto; }
  @media (max-width: 768px) {
    .modulex-kayan-kucuk-resim-kap { padding-inline: 16px; }
    .modulex-kayan-kucuk-resim-byazi { grid-template-columns: minmax(0, 1fr); }
    .modulex-kayan-kucuk-resim-byazi .modulex-kayan-kucuk-resim-scta { grid-column: 1; grid-row: auto; }
    .modulex-kayan-kucuk-resim-nokta { width: 76px; height: 52px; }
    .modulex-kayan-kucuk-resim-ok { width: 42px; height: 42px; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-kayan-kucuk-resim :is(.modulex-kayan-kucuk-resim-baslik, .modulex-kayan-kucuk-resim-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-kayan-kucuk-resim-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-kayan-kucuk-resim { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-kayan-kucuk-resim *, .modulex-kayan-kucuk-resim *::before, .modulex-kayan-kucuk-resim *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-kayan-kucuk-resim";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const kayan = (s, P, az) => {
          const k = s.querySelector("." + P + "-karusel");
          if (!k) return;
          const sl = [...k.querySelectorAll("." + P + "-slayt")];
          const nk = [...k.querySelectorAll("." + P + "-nokta")];
          const oy = k.querySelector("." + P + "-oynat");
          const du = k.querySelector("." + P + "-durum");
          const n = sl.length;
          if (n < 2) return;
          s.classList.add(P + "--js");
          let sure = Number(k.dataset.sure);
          if (!Number.isFinite(sure)) sure = 6000;
          sure = Math.min(20000, Math.max(3000, sure));
          let oto = k.dataset.oto !== "0" && !az;
          let aktif = 0;
          let zam = null;
          let bekle = false;
          const rtl = () => getComputedStyle(k).direction === "rtl";
          const goster = (i, duyur) => {
            i = ((i % n) + n) % n;
            sl.forEach((x, j) => {
              const a = j === i;
              x.classList.toggle(P + "-slayt--aktif", a);
              x.setAttribute("aria-hidden", String(!a));
              x.inert = !a;
            });
            nk.forEach((x, j) => {
              x.classList.toggle(P + "-nokta--aktif", j === i);
              if (j === i) x.setAttribute("aria-current", "true");
              else x.removeAttribute("aria-current");
            });
            k.style.setProperty("--i", String(i));
            aktif = i;
            if (du && duyur) du.textContent = sl[i].getAttribute("aria-label") || "";
          };
          const durdur = () => {
            if (zam) { clearInterval(zam); zam = null; }
            k.classList.remove(P + "--oynuyor");
          };
          const baslat = () => {
            durdur();
            if (!oto || bekle || document.hidden) return;
            void k.offsetWidth;
            k.classList.add(P + "--oynuyor");
            zam = setInterval(() => goster(aktif + 1, false), sure);
          };
          const etiket = () => {
            if (!oy) return;
            oy.setAttribute("aria-label", oto ? (k.dataset.dur || "") : (k.dataset.oyna || ""));
            const ik = oy.querySelector(".material-symbols-outlined");
            if (ik) ik.textContent = oto ? "pause" : "play_arrow";
          };
          const git = (i) => { goster(i, true); baslat(); };
          k.querySelectorAll("[data-kayan]").forEach((b) => b.addEventListener("click", () => git(aktif + (b.dataset.kayan === "geri" ? -1 : 1))));
          nk.forEach((b, j) => b.addEventListener("click", () => git(j)));
          if (oy) oy.addEventListener("click", () => { oto = !oto; etiket(); if (oto) { bekle = false; baslat(); } else durdur(); });
          k.addEventListener("keydown", (e) => {
            const r = rtl();
            if (e.key === "ArrowRight") { e.preventDefault(); git(aktif + (r ? -1 : 1)); }
            else if (e.key === "ArrowLeft") { e.preventDefault(); git(aktif + (r ? 1 : -1)); }
            else if (e.key === "Home") { e.preventDefault(); git(0); }
            else if (e.key === "End") { e.preventDefault(); git(n - 1); }
          });
          k.addEventListener("mouseenter", () => { bekle = true; durdur(); });
          k.addEventListener("mouseleave", () => { bekle = false; baslat(); });
          k.addEventListener("focusin", () => { bekle = true; durdur(); });
          k.addEventListener("focusout", (e) => { if (!k.contains(e.relatedTarget)) { bekle = false; baslat(); } });
          let bx = null;
          k.addEventListener("touchstart", (e) => { bx = e.touches && e.touches[0] ? e.touches[0].clientX : null; }, { passive: true });
          k.addEventListener("touchend", (e) => {
            if (bx === null || !e.changedTouches || !e.changedTouches[0]) return;
            const f = e.changedTouches[0].clientX - bx;
            bx = null;
            if (Math.abs(f) < 40) return;
            git(aktif + ((f < 0) !== rtl() ? 1 : -1));
          }, { passive: true });
          document.addEventListener("visibilitychange", () => { if (document.hidden) durdur(); else baslat(); });
          goster(0, false);
          etiket();
          baslat();
        };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      kayan(s, P, az);
    });
  })();
</script>
