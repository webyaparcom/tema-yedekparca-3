<div class="swiper-container modulex">
  <div class="swiper-wrapper" id="modulex">{{imglist}}</div>
  <div class="swiper-button-next"></div>
  <div class="swiper-button-prev"></div>
  <div class="swiper-pagination"></div>
</div>
<style>
  .swiper-container {
    width: 100%;
    height: 100%;
  }

  .swiper-slide {
    display: -webkit-box;
    display: -ms-flexbox;
    display: -webkit-flex;
    display: flex;
    -webkit-box-pack: center;
    -ms-flex-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
    -webkit-box-align: center;
    -ms-flex-align: center;
    -webkit-align-items: center;
    align-items: center;
  }

  .swiper-slide>img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Safari özel düzeltme */
  @media not all and (min-resolution:.001dpcm) {
    @supports (-webkit-appearance:none) {
      .swiper-slide>img {
        height: auto;
        min-height: 100%;
        -webkit-transform: translateZ(0);
        transform: translateZ(0);
      }

      .swiper-slide {
        overflow: hidden;
      }
    }
  }

  .swiper-container {
    margin-left: auto;
    margin-right: auto;
  }

  /* W2 — animasyon, mobil, erisilebilirlik */
  @keyframes modulexW2Enter {
    from { opacity: 0.98; }
    to { opacity: 1; }
  }

  [class*="modulex"] {
    box-sizing: border-box;
    animation: modulexW2Enter 0.3s ease;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  a, button, [role="button"], input[type="submit"], input[type="button"] {
    cursor: pointer;
  }

  @media (max-width: 768px) {
    [class*="modulex"] {
      max-width: 100%;
      overflow-x: hidden;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    [class*="modulex"] {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
<script>

(function headerSliderInit() {
  var attempts = 0;
  var maxAttempts = 20;
  var timer = setInterval(function () {
    attempts++;
    if (typeof Swiper === "function") {
      clearInterval(timer);
      new Swiper(".modulex", {
        slidesPerView: 1,
        spaceBetween: 30,
        loop: true,
        autoplay: {
          delay: "--delay--",
          disableOnInteraction: false,
        },
        pagination: {
          el: ".swiper-pagination",
          clickable: true,
        },
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
      });
    } else if (attempts >= maxAttempts) {
      clearInterval(timer);
      console.warn("header/slider: Swiper bulunamadı, slider başlatılamadı.");
    }
  }, 250);
})();
</script>
