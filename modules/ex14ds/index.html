<section class="modulex-galeri-slayt{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-galeri-slayt-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</section>

<style>
  /* galeri-slayt — Aynı anda tek görsele odaklanan sunum (slayt) + küçük resim gezgini; sinema/ürün detay sayfası hissi. */
  .modulex-galeri-slayt { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-galeri-slayt *, .modulex-galeri-slayt *::before, .modulex-galeri-slayt *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-galeri-slayt :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-galeri-slayt :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-galeri-slayt :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-galeri-slayt :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-galeri-slayt img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-galeri-slayt) img { height: auto; }
  .modulex-galeri-slayt [hidden] { display: none !important; }
  .modulex-galeri-slayt :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-galeri-slayt :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-galeri-slayt-ic { max-width: --max--; margin-inline: auto; }
  .modulex-galeri-slayt-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-galeri-slayt--bassiz .modulex-galeri-slayt-bas { display: none; }
  .modulex-galeri-slayt-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-galeri-slayt-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-galeri-slayt-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-galeri-slayt-bas { max-width: 780px; margin-inline: auto; text-align: center; justify-items: center; }
  .modulex-galeri-slayt-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-galeri-slayt-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-galeri-slayt-dugme:hover { transform: translateY(-2px); }
  .modulex-galeri-slayt-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-galeri-slayt-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-galeri-slayt-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-galeri-slayt-sahne { display: grid; gap: 40px; }
  .modulex-galeri-slayt-slayt { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); align-items: end; gap: clamp(20px, 3vw, 44px); animation: modulex-galeri-slayt-gel 0.5s ease both; }
  .modulex-galeri-slayt-kap { overflow: hidden; border-radius: --yuvarlak--; background: --kartBg--; }
  .modulex-galeri-slayt-g { width: 100%; aspect-ratio: 16 / 10; height: auto; object-fit: cover; }
  .modulex-galeri-slayt-alt { display: grid; gap: 10px; padding-block-end: 10px; }
  .modulex-galeri-slayt-sayac { color: --accentInk--; font-size: 0.9rem; font-weight: 700; letter-spacing: 0.08em; font-variant-numeric: tabular-nums; }
  .modulex-galeri-slayt-alt .modulex-galeri-slayt-kbaslik { font-size: clamp(1.4rem, 2.4vw, 2rem); font-weight: 750; }
  .modulex-galeri-slayt:not(.modulex-galeri-slayt--js) .modulex-galeri-slayt-kucukler { display: none; }
  .modulex-galeri-slayt-kucukler { display: flex; gap: 10px; margin-block-start: 22px; overflow-x: auto; padding-block: 4px; scrollbar-width: thin; }
  .modulex-galeri-slayt-kucuk { flex: none; width: 108px; padding: 0; border: 2px solid transparent; border-radius: 10px; overflow: hidden; background: --kartBg--; opacity: 0.55; transition: opacity 0.3s ease, border-color 0.3s ease; }
  .modulex-galeri-slayt-kucuk:hover { opacity: 0.85; }
  .modulex-galeri-slayt-kucuk[aria-pressed="true"] { opacity: 1; border-color: --accent--; }
  .modulex-galeri-slayt-kucuk img, .modulex-galeri-slayt-kucuk .modulex-galeri-slayt-yer { width: 100%; aspect-ratio: 4 / 3; height: auto; object-fit: cover; }
  @keyframes modulex-galeri-slayt-gel { from { opacity: 0; } to { opacity: 1; } }
  @media (max-width: 768px) {
    .modulex-galeri-slayt-slayt { grid-template-columns: minmax(0, 1fr); gap: 16px; }
    .modulex-galeri-slayt-kucuk { width: 84px; }
  }
  .modulex-galeri-slayt-yer { display: grid; place-items: center; width: 100%; aspect-ratio: 4 / 3; background: color-mix(in srgb, --accent-- 14%, --kartBg--); color: --accentInk--; }
  .modulex-galeri-slayt-yer .material-symbols-outlined { font-size: 40px; }
  .modulex-galeri-slayt-bag { color: inherit; text-decoration: none; }
  .modulex-galeri-slayt-bag:hover { text-decoration: underline; text-underline-offset: 4px; }
  .modulex-galeri-slayt-kbaslik { font-size: 1.05rem; font-weight: 700; line-height: 1.3; }
  .modulex-galeri-slayt-kmetin { color: --muted--; font-size: 0.95rem; line-height: 1.6; }
  .modulex-galeri-slayt-kat { color: --accentInk--; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  .modulex-galeri-slayt-kontrol { display: flex; gap: 10px; justify-content: flex-end; margin-block-start: 18px; }
  .modulex-galeri-slayt-ok { display: inline-grid; place-items: center; width: 48px; height: 48px; border: 1px solid --cizgi--; border-radius: 50%; background: --kartBg--; color: --text--; transition: background 0.25s ease, color 0.25s ease, opacity 0.25s ease; }
  .modulex-galeri-slayt-ok:hover:not(:disabled) { background: --accent--; color: --accentText--; }
  .modulex-galeri-slayt-ok:disabled { opacity: 0.4; cursor: default; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-galeri-slayt :is(.modulex-galeri-slayt-baslik, .modulex-galeri-slayt-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-galeri-slayt-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-galeri-slayt { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-galeri-slayt *, .modulex-galeri-slayt *::before, .modulex-galeri-slayt *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-galeri-slayt";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const secim = (s, P) => {
        const c = [...s.querySelectorAll("[data-sec]")];
        const p = [...s.querySelectorAll("[data-secim]")];
        if (!c.length) return;
        s.classList.add(P + "--js");
        const sec = (n) => {
          c.forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.sec === n)));
          p.forEach((x) => { x.hidden = x.dataset.secim !== n; });
        };
        sec(c[0].dataset.sec);
        c.forEach((x) => x.addEventListener("click", () => sec(x.dataset.sec)));
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      secim(s, P, az);
    });
  })();
</script>
