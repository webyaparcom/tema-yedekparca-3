<div class="modulex-title f36">
  <h1>{{name}}</h1>
</div>
<div class="modulex">
  <div class="modulex-menu">{{pagelist}}</div>
  <div class="modulex-desc">
    {{imgdata}}

    <div class="modulex-body">{{text}}</div>
  </div>
</div>

<style>
  #content {
    justify-content: start;
  }

  .modulex {
    width: var(--max);
    margin-top: 20px;
    gap: 10px;
    float: left;
  }

  .modulex-menu {
    width: 200px;
    background-color: #f9f9f9;
    border-radius: 5px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    float: left;
  }

  .modulex-desc {
    display: flex;
    flex-direction: column;
    gap: 10px;
    float: right;
  }

  .modulex-menu > a {
    background-color: #fff;
    padding: 10px;
    float: left;
    border-radius: 5px;
  }

  .modulex-menu > .active,
  .modulex-menu > a:hover {
    background-color: --menu-active--;
    color: --activetext--; /* 31 Eki: sabit beyaz → token */
    display: flex;
  }

  .modulex-desc-menu {
    width: 200px;
    background-color: --menu-active--;
    display: flex;
    flex-direction: column;
    border-radius: 5px;
  }

  .modulex-desc-menu > div {
    padding: 5px;
    border-radius: 5px;
    background-color: #fff;
    margin: 5px;
  }

  .modulex-desc-body {
    display: flex;
    justify-content: space-between;
  }

  .modulex-title {
    width: 100%;
    height: --height--px;
    background-color: --backgroundcolor--;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    color: --textcolor--; /* 31 Eki: sabit beyaz → token */
    font-weight: bold;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
  }

  .modulex-title::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url("/page/{{id}}/bg/{{bgimg}}");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    opacity: --opacity--;
    z-index: 1;
  }

  .modulex-title h1 {
    position: relative;
    z-index: 2;
    font-size: --font-size--px;
    margin: 0;
  }

  .modulex-body {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .modulex-img {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
  }

  .modulex-img img {
    width: 100%;
    border-radius: 10px;
  }

  @media screen and (min-width: 1024px) {
    .modulex-desc {
      width: calc(var(--max) - 240px);
    }
  }

  @media screen and (max-width: 1024px) {
    .modulex {
      flex-direction: column;
      width: calc(100% - 10px);
      padding: 5px;
      gap: 20px;
    }

    .modulex-img {
      width: 100%;
    }

    .modulex-body {
      width: 100%;
    }

    .modulex-menu {
      display: none;
    }

    .modulex-desc {
      width: 100% !important;
    }
  }

  /* W2 — animasyon, mobil, erisilebilirlik */
  @keyframes modulexW2Enter {
    from { opacity: 0.98; }
    to { opacity: 1; }
  }

  [class*="modulex"] {
    box-sizing: border-box;
    animation: modulexW2Enter 0.3s ease;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  a, button, [role="button"], input[type="submit"], input[type="button"] {
    cursor: pointer;
  }

  @media (max-width: 768px) {
    [class*="modulex"] {
      max-width: 100%;
      overflow-x: hidden;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    [class*="modulex"] {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
