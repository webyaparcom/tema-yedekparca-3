<section class="modulex-cta" data-stil="--stil--">
  <div class="modulex-cta-container">
    <div class="modulex-cta-content">
      <h2 class="modulex-cta-title">{{title}}</h2>
      <p class="modulex-cta-desc">{{description}}</p>
    </div>
    <div class="modulex-cta-actions">
      <a href="{{btn1Url}}" class="modulex-cta-btn modulex-cta-btn-primary">
        <span>{{btn1Text}}</span>
        <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
      </a>
      <a href="{{btn2Url}}" class="modulex-cta-btn modulex-cta-btn-secondary">
        <span>{{btn2Text}}</span>
      </a>
    </div>
  </div>
</section>

<style>
  .modulex-cta {
    width: 100%;
    padding: 64px 20px;
    background: --gradient--;
    box-sizing: border-box;
    overflow: hidden;
  }

  .modulex-cta-container {
    max-width: --max--;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
    flex-wrap: wrap;
    animation: modulexCtaIn 0.6s ease both;
  }

  .modulex-cta-content {
    flex: 1;
    min-width: 260px;
  }

  .modulex-cta-title {
    font-size: 30px;
    font-weight: 800;
    color: #fff;
    margin: 0 0 10px;
    line-height: 1.25;
  }

  .modulex-cta-desc {
    font-size: 16px;
    color: rgba(255, 255, 255, 0.85);
    margin: 0;
    line-height: 1.7;
  }

  .modulex-cta-actions {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }

  .modulex-cta-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 48px;
    padding: 13px 28px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
    box-sizing: border-box;
  }

  .modulex-cta-btn-primary {
    background: --btnbg--;
    color: --btncolor-- !important;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
  }

  a.modulex-cta-btn-primary,
  .modulex-cta-btn-primary {
    color: --btncolor-- !important;
  }

  .modulex-cta-btn-primary > *,
  .modulex-cta-btn-primary .material-symbols-outlined {
    color: inherit !important;
  }

  .modulex-cta-btn-primary:hover {
    background-color: #E9F3FB;
    transform: translateY(-3px);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.24);
  }

  .modulex-cta-btn-secondary {
    background: rgba(255, 255, 255, 0.14);
    color: #FFFFFF !important;
    border: 1.5px solid rgba(255, 255, 255, 0.4);
  }

  a.modulex-cta-btn-secondary,
  .modulex-cta-btn-secondary {
    color: #FFFFFF !important;
  }

  .modulex-cta-btn-secondary > *,
  .modulex-cta-btn-secondary .material-symbols-outlined {
    color: #FFFFFF !important;
  }

  .modulex-cta-btn-secondary:hover {
    background: rgba(255, 255, 255, 0.24);
    transform: translateY(-3px);
  }

  @keyframes modulexCtaIn {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (max-width: 768px) {
    .modulex-cta {
      padding: 44px 14px;
    }

    .modulex-cta-container {
      flex-direction: column;
      align-items: flex-start;
    }

    .modulex-cta-title {
      font-size: 24px;
    }

    .modulex-cta-actions {
      width: 100%;
    }

    .modulex-cta-btn {
      flex: 1;
      min-width: 140px;
    }

    [class*="modulex"] {
      max-width: 100%;
      box-sizing: border-box;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    [class*="modulex"],
    [class*="modulex"] * {
      animation: none !important;
      transition: none !important;
    }
  }

  /* ---- G8-D varyantlar (31 Eki 2026): desing.stil → kök data-stil. "" = klasik (--gradient-- bant, sabit beyaz yazı — eski, dokunulmadı).
     Varyant renkleri yalnız var(--mx-site-*) token çiftleri (primary/primary-contrast, surface/text) — koyu modda paletten döner. ---- */

  /* gradient — token gradient, yuvarlak köşeli iç bant, ortalı yığın, dekoratif ışık daireleri */
  [data-stil="gradient"] {
    background: transparent;
    padding: 32px 20px;
    overflow: visible;
  }

  [data-stil="gradient"] .modulex-cta-container {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    flex-direction: column;
    text-align: center;
    gap: 28px;
    padding: 64px 40px;
    border-radius: var(--mx-radius-xl, 28px);
    background: linear-gradient(135deg, var(--mx-site-primary, #1e3046) 0%, color-mix(in srgb, var(--mx-site-primary, #1e3046) 72%, var(--mx-site-text, #1b1b1b)) 100%);
    color: var(--mx-site-primary-contrast, #fff);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
  }

  [data-stil="gradient"] .modulex-cta-container::before,
  [data-stil="gradient"] .modulex-cta-container::after {
    content: "";
    position: absolute;
    z-index: -1;
    border-radius: 50%;
    pointer-events: none;
    background-color: rgba(255, 255, 255, 0.1);
  }

  [data-stil="gradient"] .modulex-cta-container::before {
    width: 320px;
    height: 320px;
    top: -160px;
    inset-inline-end: -80px;
  }

  [data-stil="gradient"] .modulex-cta-container::after {
    width: 200px;
    height: 200px;
    bottom: -110px;
    inset-inline-start: -40px;
  }

  [data-stil="gradient"] .modulex-cta-content {
    max-width: 720px;
  }

  [data-stil="gradient"] .modulex-cta-title {
    font-size: 34px;
    color: var(--mx-site-primary-contrast, #fff);
  }

  [data-stil="gradient"] .modulex-cta-desc {
    font-size: 17px;
    color: var(--mx-site-primary-contrast, #fff);
    opacity: 0.88;
  }

  [data-stil="gradient"] .modulex-cta-actions {
    justify-content: center;
  }

  [data-stil="gradient"] .modulex-cta-btn-primary,
  [data-stil="gradient"] a.modulex-cta-btn-primary {
    background: var(--mx-site-primary-contrast, #fff);
    color: var(--mx-site-primary, #1e3046) !important;
    border-radius: var(--mx-radius-full, 999px);
  }

  [data-stil="gradient"] .modulex-cta-btn-primary:hover {
    background-color: color-mix(in srgb, var(--mx-site-primary-contrast, #fff) 88%, var(--mx-site-primary, #1e3046));
  }

  [data-stil="gradient"] .modulex-cta-btn-secondary,
  [data-stil="gradient"] a.modulex-cta-btn-secondary {
    background: transparent;
    color: var(--mx-site-primary-contrast, #fff) !important;
    border: 1.5px solid color-mix(in srgb, var(--mx-site-primary-contrast, #fff) 55%, transparent);
    border-radius: var(--mx-radius-full, 999px);
  }

  [data-stil="gradient"] .modulex-cta-btn-secondary > * {
    color: inherit !important;
  }

  [data-stil="gradient"] .modulex-cta-btn-secondary:hover {
    background: color-mix(in srgb, var(--mx-site-primary-contrast, #fff) 14%, transparent);
  }

  /* kart-yuzen — sayfa zemininde yüzen yüzey kartı, dekoratif vurgu daireleri, metin solda / düğmeler sağda */
  [data-stil="kart-yuzen"] {
    background: transparent;
    padding: 40px 20px;
    overflow: visible;
  }

  [data-stil="kart-yuzen"] .modulex-cta-container {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    padding: 48px 44px;
    border-radius: var(--mx-radius-xl, 24px);
    border: 1px solid color-mix(in srgb, var(--mx-site-text, #1b1b1b) 10%, transparent);
    background-color: var(--mx-site-surface, #fff);
    color: var(--mx-site-text, #1b1b1b);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.12);
  }

  [data-stil="kart-yuzen"] .modulex-cta-container::before,
  [data-stil="kart-yuzen"] .modulex-cta-container::after {
    content: "";
    position: absolute;
    z-index: -1;
    border-radius: 50%;
    pointer-events: none;
    background-color: color-mix(in srgb, var(--mx-site-primary, #2563eb) 12%, transparent);
  }

  [data-stil="kart-yuzen"] .modulex-cta-container::before {
    width: 240px;
    height: 240px;
    top: -120px;
    inset-inline-end: -70px;
  }

  [data-stil="kart-yuzen"] .modulex-cta-container::after {
    width: 140px;
    height: 140px;
    bottom: -70px;
    inset-inline-start: 38%;
  }

  [data-stil="kart-yuzen"] .modulex-cta-content {
    padding-inline-start: 18px;
    border-inline-start: 4px solid var(--mx-site-primary, #2563eb);
  }

  [data-stil="kart-yuzen"] .modulex-cta-title {
    color: var(--mx-site-text, #1b1b1b);
  }

  [data-stil="kart-yuzen"] .modulex-cta-desc {
    color: color-mix(in srgb, var(--mx-site-text, #1b1b1b) 80%, transparent);
  }

  [data-stil="kart-yuzen"] .modulex-cta-btn-primary,
  [data-stil="kart-yuzen"] a.modulex-cta-btn-primary {
    background: var(--mx-site-primary, #2563eb);
    color: var(--mx-site-primary-contrast, #fff) !important;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.14);
  }

  [data-stil="kart-yuzen"] .modulex-cta-btn-primary:hover {
    background-color: color-mix(in srgb, var(--mx-site-primary, #2563eb) 85%, var(--mx-site-text, #1b1b1b));
  }

  [data-stil="kart-yuzen"] .modulex-cta-btn-secondary,
  [data-stil="kart-yuzen"] a.modulex-cta-btn-secondary {
    background: transparent;
    color: var(--mx-site-text, #1b1b1b) !important;
    border: 1.5px solid color-mix(in srgb, var(--mx-site-text, #1b1b1b) 25%, transparent);
  }

  [data-stil="kart-yuzen"] .modulex-cta-btn-secondary > * {
    color: inherit !important;
  }

  [data-stil="kart-yuzen"] .modulex-cta-btn-secondary:hover {
    background: color-mix(in srgb, var(--mx-site-text, #1b1b1b) 6%, transparent);
  }

  [dir="rtl"] [data-stil="gradient"] .modulex-cta-btn-primary .material-symbols-outlined,
  [dir="rtl"] [data-stil="kart-yuzen"] .modulex-cta-btn-primary .material-symbols-outlined {
    transform: scaleX(-1);
  }

  @media (max-width: 768px) {
    [data-stil="gradient"] {
      padding: 20px 12px;
    }

    [data-stil="gradient"] .modulex-cta-container {
      padding: 44px 22px;
      align-items: center;
    }

    [data-stil="gradient"] .modulex-cta-title {
      font-size: 26px;
    }

    [data-stil="kart-yuzen"] {
      padding: 24px 12px;
    }

    [data-stil="kart-yuzen"] .modulex-cta-container {
      padding: 32px 22px;
    }
  }
</style>
